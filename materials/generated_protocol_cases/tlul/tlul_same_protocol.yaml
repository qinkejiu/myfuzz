project_name: tlul_same_protocol_soc
clock_freq: 50000000
reset_active: low
metadata:
  protocol_suite: tlul
  cpu_master_protocol: tlul
  fabric_strategy: protocol_master_to_canonical_mmio_bridge
components:
  cpu0:
    kind: cpu
    filelist: materials/protocol_cpus/picorv32_tlul_master.f
    module: picorv32_tlul_master
    description: picorv32_tlul_master same-protocol CPU master for tlul
  ram0:
    kind: ram
    filelist: materials/simple_ips/ram.f
    module: simple_ram
    description: 'tlul case material: fallback_simple_ram'
  timer0:
    kind: timer
    filelist: materials/cases/famous_ip_models.f
    module: opentitan_aon_timer_model
    description: 'tlul case material: opentitan_aon_timer_model'
  spi0:
    kind: spi
    filelist: materials/cases/famous_ip_models.f
    module: opentitan_spi_device_model
    description: 'tlul case material: opentitan_spi_device_model'
  i2c0:
    kind: i2c
    filelist: materials/cases/famous_ip_models.f
    module: opentitan_i2c_model
    description: 'tlul case material: opentitan_i2c_model'
address_map:
- component: ram0
  base_addr: 0
  size: 65536
  bus_protocol: tlul
- component: timer0
  base_addr: 1073807360
  size: 4096
  bus_protocol: tlul
- component: spi0
  base_addr: 1073872896
  size: 4096
  bus_protocol: tlul
- component: i2c0
  base_addr: 1073938432
  size: 4096
  bus_protocol: tlul
connections:
- from: cpu0
  from_interface: tlul_bus
  to: ram0
  to_interface: slave_port
  protocol: simple_bus
- from: cpu0
  from_interface: tlul_bus
  to: timer0
  to_interface: slave_port
  protocol: simple_bus
- from: cpu0
  from_interface: tlul_bus
  to: spi0
  to_interface: slave_port
  protocol: simple_bus
- from: cpu0
  from_interface: tlul_bus
  to: i2c0
  to_interface: slave_port
  protocol: simple_bus
