project_name: axi_lite_roles_only_soc
clock_freq: 50000000
reset_active: low
metadata:
  protocol_suite: axi_lite
  cpu_master_protocol: axi_lite
components:
  cpu0:
    kind: cpu
    module: axi_lite_probe_cpu
    filelist: materials/protocol_cpus/axi_lite_probe_cpu.f
    description: dependency-free AXI-Lite CPU-role protocol initiator
  ram0:
    kind: ram
    module: simple_ram
    filelist: materials/simple_ips/ram.f
  uart0:
    kind: uart
    module: simple_uart
    filelist: materials/simple_ips/uart.f
  gpio0:
    kind: gpio
    module: pulp_axi_lite_regs_model
    filelist: materials/cases/famous_ip_models.f
