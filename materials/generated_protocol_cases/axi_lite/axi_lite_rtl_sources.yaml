project_name: axi_lite_rtl_sources_soc
protocol: axi_lite
clock_freq: 50000000
reset_active: low
rtl_sources:
  cpu0:
    role: cpu
    filelist: materials/protocol_cpus/axi_lite_probe_cpu.f
    interface: axi_lite_initiator
    description: CPU-role AXI-Lite initiator inferred from RTL filelist
  ram0:
    role: ram
    filelist: materials/simple_ips/ram.f
    interface: simple_bus_target
  uart0:
    role: uart
    filelist: materials/simple_ips/uart.f
    interface: simple_bus_target
  gpio0:
    role: gpio
    filelist: materials/cases/famous_ip_models.f
    interface: simple_bus_target
